<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B49F0">
<title>Intruso</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23FFD23F' stroke='%2317143F' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@500;700;800&display=swap">
<style>
  /* Direção visual: adesivos recortados. Contorno grosso de tinta, sombra dura, cores chapadas
     sobre azul-ultramar. A personalidade vem dos personagens; o resto fica quieto. */
  :root {
    --ink: #17143F; --blue: #3B49F0; --tint: #EEF0FF; --sun: #FFD23F; --coral: #FF5A5F; --mint: #1FC98D; --muted: #5A5890;
    --display: 'Bricolage Grotesque', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
    --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--blue); }
  body {
    margin: 0; min-height: 100dvh; color: var(--ink); font: 500 16px/1.45 var(--body);
    background-color: var(--blue);
    background-image: radial-gradient(rgba(255, 255, 255, .16) 1.6px, transparent 1.8px);
    background-size: 24px 24px;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; gap: 16px;
    padding: max(14px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
  h1, h2, h3, p { margin: 0; }
  h1, h2 { font-family: var(--display); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; color: #fff; }
  h1 { font-size: 2.6rem; }
  h2 { font-size: 1.35rem; }
  .panel h2 { color: var(--ink); }
  .sub { color: rgba(255, 255, 255, .88); font-weight: 700; }
  .lead { color: #fff; font-size: 1.12rem; font-weight: 700; max-width: 30ch; }
  [hidden] { display: none !important; }
  :is(button, input):focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }

  /* barra superior */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
  .top:empty { display: none; }
  .top .r { display: flex; align-items: center; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 3px solid var(--ink);
    border-radius: 999px; background: #fff; color: var(--ink); font: 800 .95rem var(--body); }
  button.pill { cursor: pointer; }
  .pill b { font: 800 1.05rem var(--display); letter-spacing: .12em; }
  .iconbtn { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 3px solid var(--ink);
    border-radius: 50%; background: #fff; color: var(--ink); cursor: pointer; }
  .ic { display: inline-grid; width: 1.25em; height: 1.25em; flex: none; }
  .ic svg { width: 100%; height: 100%; }

  /* botões e campos */
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px; padding: 0 20px;
    border: 3px solid var(--ink); border-radius: 16px; background: #fff; color: var(--ink); font: 800 1.05rem var(--display);
    cursor: pointer; box-shadow: 0 5px 0 var(--ink); transition: transform .08s, box-shadow .08s, background-color .15s; }
  .btn:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 0 0 var(--ink); }
  .btn.primary { background: var(--sun); }
  .btn.ghost { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .75); box-shadow: none; }
  .btn.ghost:active:not(:disabled) { transform: none; background: rgba(255, 255, 255, .14); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  label { display: block; margin-bottom: 6px; font-weight: 800; font-size: .92rem; }
  input { width: 100%; min-height: 54px; padding: 0 16px; border: 3px solid var(--ink); border-radius: 14px; background: #fff;
    color: var(--ink); font: 700 1.1rem var(--body); }
  input::placeholder { color: #8F8DB8; font-weight: 600; }
  input:focus { outline: none; box-shadow: 0 0 0 4px var(--sun); }
  .code-in { text-align: center; text-transform: uppercase; letter-spacing: .35em; padding-left: calc(16px + .35em);
    font: 800 1.3rem var(--display); }
  .form-row { display: flex; gap: 8px; }
  .form-row input { flex: 1; min-width: 0; }
  .form-row .btn { width: auto; flex: none; padding: 0 18px; }

  .panel { display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 3px solid var(--ink); border-radius: 22px;
    background: #fff; box-shadow: 0 6px 0 var(--ink); }
  .panel.flat { box-shadow: none; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .screen { display: flex; flex-direction: column; gap: 16px; animation: fade .2s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
  @keyframes grow { from { width: 0; } }
  @keyframes nudge { 50% { transform: scale(1.025); } }
  @keyframes drain { to { transform: scaleX(0); } }
  @keyframes fall { to { transform: translateY(110vh) rotate(var(--r)); } }

  /* personagens */
  .av { --s: 48px; display: block; width: var(--s); height: var(--s); flex: none; overflow: hidden; border: 3px solid var(--ink); border-radius: 50%; }
  .av.fill { width: 100%; height: auto; aspect-ratio: 1; }
  .av svg { display: block; width: 100%; height: 100%; }
  .avgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; padding: 6px 4px; }
  .avbtn { padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; transition: transform .15s; }
  .avbtn:active:not(:disabled) { transform: scale(.92); }
  .avbtn[aria-pressed=true] { transform: scale(1.1); box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--ink); }
  .avbtn:disabled { opacity: .28; filter: grayscale(1); cursor: not-allowed; }

  /* início */
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo .mark { width: 68px; height: 68px; flex: none; transform: rotate(-8deg); filter: drop-shadow(0 4px 0 var(--ink)); }
  .logo h1 { font-size: 3.1rem; }

  /* lobby */
  .invite { display: flex; flex-direction: column; gap: 12px; text-align: center; }
  .code { display: flex; justify-content: center; gap: 8px; }
  .code span { display: grid; place-items: center; width: 60px; height: 74px; border: 3px solid var(--ink); border-radius: 14px;
    background: var(--sun); box-shadow: 0 5px 0 var(--ink); font: 800 2.5rem var(--display); color: var(--ink); }
  .code span:nth-child(odd) { transform: rotate(-3deg); }
  .code span:nth-child(even) { transform: rotate(2.5deg); }
  .tags { display: flex; flex-wrap: wrap; gap: 10px; }
  .tag { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 4px 14px 4px 4px; border: 3px solid var(--ink);
    border-radius: 999px; background: #fff; color: var(--ink); font: 800 1rem var(--body); animation: pop .3s both; }
  .tag .av { --s: 38px; }
  .tag .nm { max-width: 11ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag.me { background: var(--sun); }
  .tag.off { opacity: .55; }
  button.tag { cursor: pointer; }
  .tag .ic { width: 1.05em; height: 1.05em; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-height: 44px; padding: 0 16px; border: 3px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink);
    font: 800 .95rem var(--body); cursor: pointer; transition: background-color .15s, color .15s; }
  .chip[aria-pressed=true] { background: var(--ink); color: #fff; }
  .chip:disabled { cursor: default; }
  .chip:disabled:not([aria-pressed=true]) { opacity: .5; }

  /* placar */
  .hero { display: flex; flex-direction: column; gap: 4px; }
  .rows { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .row { display: grid; grid-template-columns: 26px 48px minmax(0, 1fr) auto; align-items: center; gap: 10px; }
  .rank { text-align: center; font: 800 1.2rem var(--display); }
  .rname { min-width: 0; }
  .rname .nm { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; }
  .bar { display: block; height: 14px; margin-top: 4px; overflow: hidden; border: 3px solid var(--ink); border-radius: 99px; background: var(--tint); }
  .bar i { display: block; width: var(--w); height: 100%; background: var(--mint); }
  .row.first .bar i { background: var(--sun); }
  .pts { display: flex; align-items: center; justify-content: flex-end; gap: 6px; min-width: 2ch; font: 800 1.5rem var(--display); }
  .delta { padding: 1px 7px; border: 2px solid var(--ink); border-radius: 99px; background: var(--mint); font: 800 .8rem var(--body); }
  .intro .row { animation: rise .5s cubic-bezier(.2, .9, .3, 1) both; animation-delay: calc(var(--i) * 80ms + 100ms); }
  .intro .bar i { animation: grow .9s cubic-bezier(.2, .9, .3, 1) both; animation-delay: calc(var(--i) * 80ms + 400ms); }
  .count { height: 14px; overflow: hidden; border: 3px solid var(--ink); border-radius: 99px; background: #fff; }
  .count i { display: block; height: 100%; background: var(--sun); transform-origin: left; animation: drain var(--dur) linear both; }

  /* dicas */
  .strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 6px 0; }
  .sp { transition: transform .25s cubic-bezier(.3, 1.5, .5, 1), opacity .25s; }
  .sp .av { --s: 42px; }
  .sp.done { opacity: .5; }
  .sp.now { transform: scale(1.25); }
  .sp.now .av { box-shadow: 0 0 0 3px var(--sun); }
  .role { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 100%; min-height: 140px;
    padding: 18px 16px; border: 3px solid var(--ink); border-radius: 22px; background: #fff; color: var(--ink); font: inherit;
    text-align: center; cursor: pointer; box-shadow: 0 6px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
  .role:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
  .role.hid { background: repeating-linear-gradient(135deg, #fff 0 12px, var(--tint) 12px 24px); }
  .role.crew { background: var(--mint); }
  .role.imp { background: var(--coral); }
  .role .big { font: 800 2.2rem/1.05 var(--display); overflow-wrap: anywhere; }
  .role .hint { font-size: .85rem; font-weight: 700; opacity: .8; }
  .role.show .big { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1) both; }
  .turn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 14px; border: 3px solid var(--ink);
    border-radius: 16px; background: #fff; font-weight: 800; text-align: center; }
  .turn small { color: var(--muted); font-weight: 700; }
  .turn.mine { background: var(--sun); animation: nudge 1.6s ease-in-out infinite; }
  .turn.mine small { color: var(--ink); }
  .clues { display: flex; flex-direction: column; gap: 10px; }
  .bub { display: flex; align-items: flex-end; gap: 10px; animation: pop .35s cubic-bezier(.3, 1.5, .5, 1) both; }
  .bub .av { --s: 40px; }
  .bub .txt { min-width: 0; padding: 6px 14px 8px; border: 3px solid var(--ink); border-radius: 18px 18px 18px 4px; background: #fff; }
  .bub small { display: block; color: var(--muted); font-size: .75rem; font-weight: 700; }
  .bub b { font: 800 1.2rem var(--display); overflow-wrap: anywhere; }

  /* votação */
  .chat { display: flex; flex-direction: column; gap: 6px; max-height: 160px; overflow-y: auto; padding-right: 4px; }
  .chat:empty::before { content: 'Ninguém falou ainda.'; color: var(--muted); font-weight: 600; }
  .msg { display: flex; align-items: flex-start; gap: 8px; }
  .msg .av { --s: 26px; border-width: 2px; }
  .msg p { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
  .msg b { font-weight: 800; }
  .vgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; padding-top: 8px; }
  .vcard { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; padding: 12px 8px 10px;
    border: 3px solid var(--ink); border-radius: 18px; background: #fff; color: var(--ink); font: 800 1rem var(--body); cursor: pointer;
    box-shadow: 0 5px 0 var(--ink); transition: transform .1s, box-shadow .1s, background-color .15s; }
  .vcard .av { --s: 64px; }
  .vcard .nm, .vcard small { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vcard small { min-height: 1.2em; color: var(--muted); font-size: .78rem; font-weight: 600; }
  .vcard[aria-pressed=true] { background: var(--sun); transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .vcard .tick { position: absolute; top: -9px; right: -7px; display: grid; place-items: center; width: 30px; height: 30px;
    border: 3px solid var(--ink); border-radius: 50%; background: var(--mint); transform: scale(0); transition: transform .2s cubic-bezier(.3, 1.6, .5, 1); }
  .vcard[aria-pressed=true] .tick { transform: scale(1); }
  .vcard .tick .ic { width: 16px; height: 16px; }
  .accused { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .accused .av { --s: 120px; border-width: 4px; animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
  .accused h2 { color: var(--ink); }

  /* resultado */
  .banner { padding: 16px; border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 6px 0 var(--ink); text-align: center;
    font: 800 1.8rem/1.1 var(--display); animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
  .banner.win { background: var(--mint); }
  .banner.lose { background: var(--coral); }
  .reveal { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .reveal .av { --s: 116px; border-width: 4px; animation: pop .6s .15s cubic-bezier(.3, 1.6, .5, 1) both; }
  .reveal .who { color: #fff; font: 800 2rem var(--display); }
  .facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .fact { padding: 6px 14px; border: 3px solid var(--ink); border-radius: 999px; background: #fff; font-weight: 800; }
  .fact.ok { background: var(--mint); }
  .fact.no { background: var(--coral); }
  .vrow { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-weight: 700; }
  .vrow .av { --s: 30px; border-width: 2px; }

  .confetti { position: fixed; inset: 0; z-index: 20; overflow: hidden; pointer-events: none; }
  .confetti i { position: absolute; top: -24px; width: 10px; height: 16px; border: 2px solid var(--ink); border-radius: 2px; animation: fall var(--t) linear forwards; }
  #toast { position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 30; max-width: 448px; margin: 0 auto;
    padding: 12px 16px; border: 3px solid var(--ink); border-radius: 14px; background: var(--coral); text-align: center; font-weight: 800; animation: pop .2s both; }
  #toast.ok { background: var(--mint); }
  #conn { align-self: center; padding: 6px 14px; border: 3px solid var(--ink); border-radius: 99px; background: var(--sun); font-size: .85rem; font-weight: 800; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main id="app">
  <div id="conn" role="status" hidden>Reconectando…</div>
  <header id="top" class="top"></header>
  <div id="view"></div>
  <noscript><p class="lead">O Intruso precisa de JavaScript para funcionar.</p></noscript>
</main>
<div id="toast" role="alert" hidden></div>
<div id="fx" class="confetti" aria-hidden="true"></div>

<script>
'use strict';

// ---------- personagens ----------
// 12 personagens desenhados em SVG (a ordem e a quantidade precisam bater com AVATAR_COUNT em server.js).
const INK = '#17143F';
const ln = `stroke="${INK}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"`;
const th = `fill="none" ${ln}`;
const sk = `stroke="${INK}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"`;
const dot = (x, y, r = 2.6) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${INK}"/>`;
const AVATARS = [
  { name: 'Gato', bg: '#BFE3FF', art:
    `<path d="M15 28L17 9l13 9z" fill="#FF9F43" ${sk}/><path d="M49 28L47 9 34 18z" fill="#FF9F43" ${sk}/>` +
    `<ellipse cx="32" cy="36" rx="19" ry="17" fill="#FF9F43" ${sk}/>${dot(25, 34)}${dot(39, 34)}` +
    `<path d="M29.5 40h5L32 43z" fill="#FF6B8B"/><path d="M32 43q-3 4-6 1M32 43q3 4 6 1M11 38h8M12 44l7-2M53 38h-8M52 44l-7-2" ${th}/>` },
  { name: 'Cachorro', bg: '#FFD9E0', art:
    `<ellipse cx="14" cy="32" rx="6" ry="12" fill="#8A5A3C" ${sk} transform="rotate(14 14 32)"/>` +
    `<ellipse cx="50" cy="32" rx="6" ry="12" fill="#8A5A3C" ${sk} transform="rotate(-14 50 32)"/>` +
    `<ellipse cx="32" cy="35" rx="18" ry="18" fill="#F0CFA0" ${sk}/><ellipse cx="32" cy="42" rx="9.5" ry="7" fill="#FFF1D6"/>` +
    `${dot(25, 31)}${dot(39, 31)}<ellipse cx="32" cy="38" rx="3.6" ry="2.7" fill="${INK}"/>` +
    `<path d="M32 40.5v3M32 43.5q-3 3-6 0M32 43.5q3 3 6 0" ${th}/><path d="M30 45.5q2 5 4 0z" fill="#FF6B8B"/>` },
  { name: 'Urso', bg: '#CFF3E3', art:
    `<circle cx="17" cy="19" r="7" fill="#A36A43" ${sk}/><circle cx="47" cy="19" r="7" fill="#A36A43" ${sk}/>` +
    `<circle cx="32" cy="36" r="19" fill="#A36A43" ${sk}/><ellipse cx="32" cy="43" rx="9.5" ry="7" fill="#E9C39B"/>` +
    `${dot(25, 32)}${dot(39, 32)}<ellipse cx="32" cy="40" rx="3.6" ry="2.6" fill="${INK}"/>` +
    `<path d="M32 42.5v2M32 44.5q-2.5 2-5 0M32 44.5q2.5 2 5 0" ${th}/>` },
  { name: 'Sapo', bg: '#FFE9A8', art:
    `<ellipse cx="32" cy="41" rx="22" ry="16" fill="#5BD08A" ${sk}/><circle cx="21" cy="25" r="9" fill="#5BD08A" ${sk}/><circle cx="43" cy="25" r="9" fill="#5BD08A" ${sk}/>` +
    `<circle cx="21" cy="25" r="5.5" fill="#fff"/><circle cx="43" cy="25" r="5.5" fill="#fff"/>${dot(22, 26, 2.8)}${dot(42, 26, 2.8)}` +
    `<path d="M19 43q13 11 26 0" ${th}/><circle cx="15" cy="41" r="3" fill="#FF8FA3" opacity=".8"/><circle cx="49" cy="41" r="3" fill="#FF8FA3" opacity=".8"/>` },
  { name: 'Coruja', bg: '#FFD0B8', art:
    `<path d="M13 22L17 8l12 9z" fill="#8E7CF0" ${sk}/><path d="M51 22L47 8 35 17z" fill="#8E7CF0" ${sk}/>` +
    `<ellipse cx="32" cy="36" rx="20" ry="19" fill="#8E7CF0" ${sk}/>` +
    `<circle cx="23" cy="32" r="8.5" fill="#fff" ${sk}/><circle cx="41" cy="32" r="8.5" fill="#fff" ${sk}/>${dot(24, 33, 3.4)}${dot(40, 33, 3.4)}` +
    `<path d="M28.5 40h7L32 46z" fill="#FFC83D" ${ln}/>` },
  { name: 'Raposa', bg: '#D9E0FF', art:
    `<path d="M12 30L15 8l15 11z" fill="#FF7A45" ${sk}/><path d="M52 30L49 8 34 19z" fill="#FF7A45" ${sk}/>` +
    `<path d="M11 29Q32 12 53 29Q51 49 32 56Q13 49 11 29z" fill="#FF7A45" ${sk}/>` +
    `<path d="M12 31Q23 33 32 52Q16 47 12 31z" fill="#fff"/><path d="M52 31Q41 33 32 52Q48 47 52 31z" fill="#fff"/>` +
    `${dot(24, 34)}${dot(40, 34)}<ellipse cx="32" cy="50" rx="3.2" ry="2.4" fill="${INK}"/>` },
  { name: 'Panda', bg: '#FFD36E', art:
    `<circle cx="17" cy="19" r="7" fill="${INK}"/><circle cx="47" cy="19" r="7" fill="${INK}"/>` +
    `<circle cx="32" cy="36" r="19" fill="#fff" ${sk}/>` +
    `<ellipse cx="24" cy="33" rx="5" ry="6.6" fill="${INK}" transform="rotate(22 24 33)"/><ellipse cx="40" cy="33" rx="5" ry="6.6" fill="${INK}" transform="rotate(-22 40 33)"/>` +
    `<circle cx="24.5" cy="33" r="1.9" fill="#fff"/><circle cx="39.5" cy="33" r="1.9" fill="#fff"/>` +
    `<ellipse cx="32" cy="42" rx="3.3" ry="2.5" fill="${INK}"/><path d="M32 44.5q-3 3-6 0M32 44.5q3 3 6 0" ${th}/>` },
  { name: 'Coelho', bg: '#C9E8FF', art:

// ---------- utilidades ----------
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* sem armazenamento: tudo bem */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* idem */ } },
};

// Monta elementos só com textContent/atributos: nada de innerHTML com dado de jogador.
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : String(kid));
  }
  return el;
}

// SVGs vêm de constantes deste arquivo; só o índice do personagem (validado) vem do servidor.
function av(i, size) {
  const a = AVATARS[i] || AVATARS[0];
  const d = h('div', { class: size ? 'av' : 'av fill', style: size ? `--s:${size}px;background:${a.bg}` : `background:${a.bg}`,
    role: 'img', 'aria-label': a.name, 'data-static': 'av' + i });
  d.innerHTML = `<svg viewBox="0 0 64 64" aria-hidden="true">${a.art}</svg>`;
  return d;
}

function icon(name) {
  const s = h('span', { class: 'ic', 'data-static': name });
  s.innerHTML = ICONS[name];
  return s;
}

// Atualiza o DOM existente em vez de recriá-lo: campos de texto, foco e animações em curso são preservados.
function syncAttrs(o, n) {
  for (const { name, value } of Array.from(n.attributes)) if (o.getAttribute(name) !== value) o.setAttribute(name, value);
  for (const { name } of Array.from(o.attributes)) if (!n.hasAttribute(name)) o.removeAttribute(name);
}

function morph(oldParent, newParent) {
  const olds = Array.from(oldParent.childNodes);
  const news = Array.from(newParent.childNodes);
  for (let i = 0; i < Math.max(olds.length, news.length); i++) {
    const o = olds[i], n = news[i];
    if (!n) { oldParent.removeChild(o); continue; }
    if (!o) { oldParent.appendChild(n); continue; }
    const keyO = o.nodeType === 1 ? o.getAttribute('data-key') : null;
    const keyN = n.nodeType === 1 ? n.getAttribute('data-key') : null;
    if (o.nodeType !== n.nodeType || o.nodeName !== n.nodeName || keyO !== keyN) { oldParent.replaceChild(n, o); continue; }
    if (o.nodeType === 3) { if (o.nodeValue !== n.nodeValue) o.nodeValue = n.nodeValue; continue; }
    syncAttrs(o, n);
    const st = o.getAttribute('data-static');
    if (st !== null && st === n.getAttribute('data-static')) continue;   // SVG idêntico: não mexe
    morph(o, n);
  }
}

let lastChat = 0;

const isHost = () => state.hostId === state.you;

function toast(msg, ok) {
  toastEl.textContent = msg;
  toastEl.className = ok ? 'ok' : '';
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, 3200);
}

async function api(path, body) {
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Algo deu errado.');
    return j;
  } catch (e) {
    toast(e instanceof TypeError ? 'Sem conexão com o servidor.' : e.message);
    throw e;
  }
}

const act = (type, extra) => api('/api/act', { code: session.code, pid: session.pid, type, ...extra }).catch(() => {});

function connect() {
  if (es) es.close();
  es = new EventSource(`/api/events?code=${encodeURIComponent(session.code)}&pid=${encodeURIComponent(session.pid)}`);
  es.onopen = () => { connEl.hidden = true; };
  es.onmessage = (e) => {
    const prev = state;
    state = JSON.parse(e.data);
    onState(prev, state);
    render();
  };
  es.onerror = () => {
    if (es.readyState === EventSource.CLOSED) {   // o servidor recusou: a sala não existe mais
      leave(); toast('Essa sala foi encerrada.');
    } else {
      connEl.hidden = false;
    }
  };
}

function leave() {
  if (es) es.close();
  ls.del('intruso-sessao');
  session = null; state = null;
  history.replaceState(null, '', location.pathname);
  render();
}

function onState(prev, s) {
  if (!prev || prev.phase !== s.phase) {
    window.scrollTo(0, 0);
    secretShown = false; pickerOpen = false; lastChat = 0;
    if (s.phase === 'intro') introDur = s.introMs;
    if (s.phase === 'result' && s.result.impostorWins === (s.you === s.impostorId)) burst();
  }
  if (isMyTurn(s) && !isMyTurn(prev)) {
    focusClue = true;
    if (navigator.vibrate) navigator.vibrate([70, 50, 70]);
  }
}

function burst() {
  const fx = document.getElementById('fx');
  const colors = ['#FFD23F', '#FF5A5F', '#1FC98D', '#7CC6FF', '#FFFFFF'];
  for (let i = 0; i < 36; i++) {
    const c = h('i', { style: `left:${Math.random() * 100}%;background:${colors[i % colors.length]};--t:${2.2 + Math.random() * 1.6}s;--r:${Math.round(Math.random() * 720 - 360)}deg;animation-delay:${Math.random() * .5}s` });
    fx.append(c);
  }
  setTimeout(() => fx.replaceChildren(), 4500);
}

// ---------- telas ----------
function ranking() {
  const rows = state.players.slice().sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
  let rank = 0, prev = null;
  return rows.map((p) => { if (p.score !== prev) rank++; prev = p.score; return { p, rank }; });
}

function scoreRows(delta) {
  const rows = ranking();
  const max = Math.max(1, ...rows.map((r) => r.p.score));
  const allZero = rows.every((r) => r.p.score === 0);   // sem pontos ainda: ninguém está "em primeiro"
  return h('ol', { class: 'rows' }, rows.map(({ p, rank }, i) => {
    const d = delta ? delta[p.id] : 0;
    return h('li', { class: 'row' + (rank === 1 && p.score > 0 ? ' first' : ''), style: `--i:${i}`, 'data-key': p.id },
      h('span', { class: 'rank' }, allZero ? '' : rank),
      av(p.avatar, 48),
      h('div', { class: 'rname' },
        h('span', { class: 'nm' }, p.name + (p.id === state.you ? ' (você)' : '')),
        h('span', { class: 'bar' }, h('i', { style: `--w:${p.score ? Math.max(8, p.score / max * 100) : 0}%` }))),
      h('b', { class: 'pts' }, d > 0 ? h('span', { class: 'delta' }, '+' + d) : null, p.score));
  }));
}

  if (s.role !== 'impostor') {
    return h('div', { class: 'screen guess', 'data-screen': 'guess' },
      h('section', { class: 'panel accused' }, av(acc.avatar, 120), h('h2', {}, `${acc.name} foi descoberto`),
        h('p', {}, 'Ainda dá para virar o jogo: o intruso tem uma chance de adivinhar a palavra.')));
  }
  return h('div', { class: 'screen guess', 'data-screen': 'guess' },
    h('form', { class: 'panel accused', 'data-form': 'guess' },
      av(acc.avatar, 120), h('h2', {}, 'Você foi descoberto'),
      h('p', {}, `A categoria é ${s.wordCategory}. Acerte a palavra secreta e vença mesmo assim.`),
      h('div', { style: 'width:100%;text-align:left' }, h('label', { for: 'palpite' }, 'Seu palpite'),
        h('input', { id: 'palpite', maxlength: 40, autocomplete: 'off' })),
      h('button', { class: 'btn primary', type: 'submit' }, 'Chutar')));
}

function resultScreen() {
  const s = state, r = s.result, imp = P(s.impostorId);
  const iWon = r.impostorWins === (s.you === s.impostorId);
  const why = { escaped: 'O intruso escapou da votação.', guessed: 'O intruso foi pego, mas acertou a palavra.', caught: 'O intruso foi pego e errou a palavra.' }[r.reason];
  const votes = Object.entries(r.votes);
  return h('div', { class: 'screen result', 'data-screen': 'result' },
    h('div', { class: 'banner ' + (iWon ? 'win' : 'lose') }, iWon ? 'Você venceu!' : 'Você perdeu'),
    h('section', { class: 'reveal' },
      h('p', { class: 'sub' }, 'O intruso era'), av(imp.avatar, 116), h('p', { class: 'who' }, imp.name),
      h('div', { class: 'facts' }, h('span', { class: 'fact' }, 'Palavra: ' + s.word),
        r.guess ? h('span', { class: 'fact ' + (r.reason === 'guessed' ? 'ok' : 'no') }, 'Palpite: ' + r.guess) : null),
      h('p', { class: 'sub' }, why)),
    votes.length ? h('section', { class: 'panel flat' }, h('h2', {}, 'Votos'),
      votes.map(([voter, target]) => h('div', { class: 'vrow', 'data-key': voter },
        av(P(voter).avatar, 30), h('b', {}, P(voter).name), 'votou em', av(P(target).avatar, 30), h('b', {}, P(target).name)))) : null,
    h('section', { class: 'panel' }, h('h2', {}, 'Placar'), scoreRows(r.delta)),
    isHost() ? h('button', { class: 'btn primary', type: 'button', 'data-act': 'again' }, 'Jogar de novo')
             : h('p', { class: 'sub', style: 'text-align:center' }, `Aguardando ${P(s.hostId).name}`));
}

const SCREENS = { lobby: lobbyScreen, intro: introScreen, clues: cluesScreen, vote: voteScreen, guess: guessScreen, result: resultScreen };

function buildHeader() {
  const t = h('header', { id: 'top', class: 'top' });
  if (!state) return t;
  t.append(
    h('button', { class: 'pill', type: 'button', 'data-act': 'copy', 'aria-label': 'Copiar link da sala' }, 'Sala', h('b', {}, state.code)),
    h('div', { class: 'r' },
      state.roundNo ? h('span', { class: 'pill' }, 'Rodada ' + state.roundNo) : null,
      h('button', { class: 'iconbtn', type: 'button', 'data-act': 'leave', 'aria-label': 'Sair da sala' }, icon('exit'))));
  return t;
}

function render() {
  morph(document.getElementById('top'), buildHeader());
  const next = state ? SCREENS[state.phase]() : homeScreen();
  const cur = view.firstElementChild;
  if (!cur || cur.getAttribute('data-screen') !== next.getAttribute('data-screen')) view.replaceChildren(next);
  else { syncAttrs(cur, next); morph(cur, next); }

  const chat = view.querySelector('.chat');
  if (chat && state.chat.length !== lastChat) { chat.scrollTop = chat.scrollHeight; lastChat = state.chat.length; }
  if (focusClue) {
    const inp = document.getElementById('dica');
    if (inp) { inp.focus(); focusClue = false; }
  }
}

// ---------- ações (eventos delegados: os elementos não guardam estado antigo) ----------
async function enter(path, body) {
  const name = document.getElementById('nome').value.trim();
  if (!name) { toast('Digite seu nome.'); document.getElementById('nome').focus(); return; }
  ls.set('intruso-nome', name);
  ls.set('intruso-avatar', myAvatar);
  try {
    const r = await api(path, { name, avatar: myAvatar, ...body });
    session = { code: r.code, pid: r.pid };
    ls.set('intruso-sessao', JSON.stringify(session));
    connect();
  } catch { /* o aviso já foi mostrado */ }
}

function shareLink() {
  const url = `${location.origin}${location.pathname}?sala=${state.code}`;
  if (navigator.share && state.phase === 'lobby') {
    navigator.share({ title: 'Intruso', text: 'Entra na minha sala do Intruso!', url }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => toast('Link da sala copiado.', true), () => toast(url));
  } else {
    toast(url);
  }
}

const ACT = {
  homeAvatar: (el) => { myAvatar = Number(el.dataset.i); ls.set('intruso-avatar', myAvatar); render(); },
  create: () => enter('/api/create', {}),
  share: shareLink,
  copy: shareLink,
  togglePicker: () => { pickerOpen = !pickerOpen; render(); },
  pickAvatar: (el) => { pickerOpen = false; render(); act('avatar', { value: Number(el.dataset.i) }); },
  category: (el) => act('category', { value: el.dataset.v }),
  start: () => act('start'),
  skip: () => act('skip'),
  toggleRole: () => { secretShown = !secretShown; render(); },
  vote: (el) => act('vote', { target: el.dataset.id }),
  again: () => act('again'),
  leave: () => {
    if (state && state.phase !== 'lobby' && !confirm('Sair da sala? Você deixa esta partida.')) return;
    leave();
  },
};

const FORM = {
  join: (f) => {
    const code = f.elements.codigo.value.trim();
    if (code.length !== 4) { toast('O código tem 4 letras.'); f.elements.codigo.focus(); return; }
    enter('/api/join', { code });
  },
  clue: (f) => { const text = f.elements.dica.value.trim(); if (text) act('clue', { text }); },
  chat: (f) => { const i = f.elements.msg; const text = i.value.trim(); if (text) { i.value = ''; act('chat', { text }); } },
  guess: (f) => { const text = f.elements.palpite.value.trim(); if (text) act('guess', { text }); },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled && ACT[el.dataset.act]) ACT[el.dataset.act](el);
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  FORM[f.dataset.form](f);
});

render();
if (session) connect();
</script>
</body>
</html>
