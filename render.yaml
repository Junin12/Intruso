# Deploy automático no Render a partir do GitHub (Blueprint).
services:
  - type: web
    name: intruso
    runtime: node
    plan: free
    buildCommand: echo "sem dependências"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      # o jogo web mudou para a Vila Sossego: este serviço só redireciona o endereço antigo
      - key: MUDOU_PARA
        value: https://vila-sossego.onrender.com/intruso/
